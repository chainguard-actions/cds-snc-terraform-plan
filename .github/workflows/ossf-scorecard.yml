name: Scorecards supply-chain security
on:
  workflow_dispatch:
  schedule:
    # Weekly on Saturdays.
    - cron: "30 1 * * 6"
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  analysis:
    name: Scorecards analysis
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@169c9b9248e36d400bebded8160c7fe2cbbc7762
        with:
          results_file: ossf-results.json
          results_format: json
          publish_results: false

      - name: "Add metadata"
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          full_repo="$GITHUB_REPOSITORY_NAME"
          OWNER="${full_repo%/*}"
          REPO="${full_repo#*/}"
          jq -c --arg owner "$OWNER" --arg repo "$REPO" \
            '. + {"metadata_owner": $owner, "metadata_repo": $repo, "metadata_query": "ossf"}' \
            ossf-results.json > ossf-results-modified.json

      - name: "Post results to Sentinel"
        uses: cds-snc/sentinel-forward-data-action@01db4a9203054ecdb60ff368c3cdfca71d62e85f
        with:
          file_name: ossf-results-modified.json
          log_type: GitHubMetadata_OSSF_Scorecard
          log_analytics_workspace_id: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          log_analytics_workspace_key: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}
