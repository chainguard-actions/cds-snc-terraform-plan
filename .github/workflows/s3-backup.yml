name: S3 backup
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  s3-backup:
    runs-on: ubuntu-latest
    steps:
    - name: Audit DNS requests
      uses: cds-snc/dns-proxy-action@f0796e7f3d6bec5d40aecb0321ed8012f5602f84 # v1.0.2
      env:
        DNS_PROXY_FORWARDTOSENTINEL: "true"
        DNS_PROXY_LOGANALYTICSWORKSPACEID: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
        DNS_PROXY_LOGANALYTICSSHAREDKEY: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0 # retrieve all history
        persist-credentials: false

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
      with:
        role-to-assume: ${{ secrets.AWS_S3_BACKUP_IAM_ROLE_ARN }}
        role-session-name: S3Backup
        aws-region: ca-central-1

    - name: Upload zip to S3 bucket
      env:
        GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        AWS_S3_BACKUP_BUCKET: ${{ secrets.AWS_S3_BACKUP_BUCKET }}
      run: |
        ZIP_FILE="$(basename "$GITHUB_REPOSITORY_NAME")-$(date '+%Y-%m-%d').zip"
        zip -rq "${ZIP_FILE}" .
        aws s3 cp "${ZIP_FILE}" "s3://${AWS_S3_BACKUP_BUCKET}/${GITHUB_REPOSITORY_NAME}/${ZIP_FILE}"

    - name: Notify Slack channel if this job failed
      if: ${{ failure() }}
      env:
        GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        SLACK_NOTIFY_WEBHOOK: ${{ secrets.SLACK_NOTIFY_WEBHOOK }}
      run: |
        json="{\"text\":\"S3 backup failed in <https://github.com/${GITHUB_REPOSITORY_NAME}>!\"}"
        curl -X POST -H 'Content-type: application/json' --data "$json" "$SLACK_NOTIFY_WEBHOOK"
