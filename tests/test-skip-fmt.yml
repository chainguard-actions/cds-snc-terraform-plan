name: Test skip-fmt skips format check
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Terraform
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip -o terraform.zip
          unzip -q terraform.zip
          sudo mv terraform /usr/local/bin/terraform
          terraform version

      - name: Create badly-formatted Terraform config
        run: |
          mkdir -p /tmp/tf-fmt-test
          printf 'terraform {\n  required_version = ">= 1.0"\n}\noutput   "hello"   {\n  value   =   "world"\n}\n' > /tmp/tf-fmt-test/main.tf

      - id: action
        uses: .
        with:
          directory: /tmp/tf-fmt-test
          comment: 'false'
          skip-plan: 'true'
          skip-conftest: 'true'
          skip-fmt: 'true'
          enable-drift-output: 'true'

      - name: Assert action succeeded with skip-fmt
        run: |
          echo "PASS: action completed successfully with skip-fmt=true (badly formatted file did not cause failure)"

      - name: Assert drift-output is set
        env:
          DRIFT_OUTPUT: ${{ steps.action.outputs.drift-output }}
        run: |
          echo "drift-output: $DRIFT_OUTPUT"
          if [ -z "$DRIFT_OUTPUT" ]; then
            echo "FAIL: drift-output is empty"
            exit 1
          fi
          echo "PASS: drift-output is set"
