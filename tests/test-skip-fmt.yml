name: Test skip-fmt skips format check
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Terraform
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl
          curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o /tmp/terraform.zip
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
          terraform version

      - id: action
        uses: .
        with:
          directory: tests/fixtures/skip-fmt-tf
          comment: 'false'
          skip-plan: 'true'
          skip-conftest: 'true'
          skip-fmt: 'true'
          enable-drift-output: 'true'

      - name: Assert action succeeded despite bad formatting (skip-fmt=true)
        env:
          DRIFT_OUTPUT: ${{ steps.action.outputs.drift-output }}
        run: |
          echo "drift-output: $DRIFT_OUTPUT"
          if [ -z "$DRIFT_OUTPUT" ]; then
            echo "FAIL: drift-output should be set"
            exit 1
          fi
          STATUS=$(echo "$DRIFT_OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])")
          echo "status: $STATUS"
          # With skip-fmt=true and skip-plan=true, there should be no errors
          if [ "$STATUS" != "no_changes" ]; then
            echo "FAIL: expected status 'no_changes' but got '$STATUS'"
            exit 1
          fi
          echo "PASS: action succeeded with skip-fmt=true despite bad formatting"
