name: Test drift-output disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Terraform
        run: |
          TERRAFORM_VERSION="1.9.8"
          curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
          unzip -q /tmp/terraform.zip -d /tmp/terraform-bin
          sudo mv /tmp/terraform-bin/terraform /usr/local/bin/terraform
          terraform version

      - id: action
        uses: .
        with:
          directory: '${{ github.workspace }}/tests/fixtures/terraform'
          comment: 'false'
          skip-plan: 'true'
          skip-fmt: 'true'
          skip-conftest: 'true'
          enable-drift-output: 'false'

      - name: Assert drift-output is empty when disabled
        env:
          DRIFT: ${{ steps.action.outputs.drift-output }}
        run: |
          echo "drift-output: '$DRIFT'"
          if [ -n "$DRIFT" ]; then
            echo "FAIL: expected drift-output to be empty when enable-drift-output is false, got '$DRIFT'"
            exit 1
          fi
          echo "PASS: drift-output is empty as expected"
