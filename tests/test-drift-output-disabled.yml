name: Test drift output disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake terraform
        run: bash tests/fixtures/setup-fake-terraform.sh "$GITHUB_WORKSPACE/tests/fixtures/plan-changes.json"
      - id: action
        uses: .
        with:
          directory: tf-test
          comment: 'false'
          skip-conftest: 'true'
          enable-drift-output: 'false'
      - name: Assert drift-output is empty
        env:
          ACTUAL: ${{ steps.action.outputs.drift-output }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: drift-output should be empty when disabled"
            exit 1
          fi
          echo "PASS"
