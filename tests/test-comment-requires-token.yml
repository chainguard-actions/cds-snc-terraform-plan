name: Test comment=true without explicit github-token uses default
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When comment=true but github-token is not provided, the action uses its
      # default value of 'false' for github-token. Since there is no PR context
      # under workflow_dispatch, the action should fail when attempting to post
      # a comment. We verify it fails (not silently succeeds with no comment).
      - id: action
        uses: .
        with:
          directory: tests/fixtures/comment-token-tf
          comment: 'true'
          skip-plan: 'true'
          skip-conftest: 'true'
          skip-fmt: 'true'
          enable-drift-output: 'false'
        continue-on-error: true

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action correctly failed when comment=true without a valid github-token"
          else
            echo "FAIL: expected action to fail but got: ${{ steps.action.outcome }}"
            exit 1
          fi
