name: Test basic usage - skip plan and conftest
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Terraform
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl
          curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o /tmp/terraform.zip
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
          terraform version

      - id: action
        uses: .
        with:
          directory: tests/fixtures/basic-tf
          comment: 'false'
          skip-plan: 'true'
          skip-conftest: 'true'
          skip-fmt: 'true'
          enable-drift-output: 'true'

      - name: Assert drift-output is set and valid JSON
        env:
          DRIFT_OUTPUT: ${{ steps.action.outputs.drift-output }}
        run: |
          echo "drift-output: $DRIFT_OUTPUT"
          if [ -z "$DRIFT_OUTPUT" ]; then
            echo "FAIL: drift-output is empty"
            exit 1
          fi
          # Validate it's valid JSON
          echo "$DRIFT_OUTPUT" | python3 -m json.tool > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: drift-output is not valid JSON"
            exit 1
          fi
          echo "PASS: drift-output is valid JSON"

      - name: Assert drift-output has expected fields
        env:
          DRIFT_OUTPUT: ${{ steps.action.outputs.drift-output }}
        run: |
          echo "drift-output: $DRIFT_OUTPUT"
          STATUS=$(echo "$DRIFT_OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])")
          HAS_CHANGES=$(echo "$DRIFT_OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['hasChanges'])")
          echo "status: $STATUS"
          echo "hasChanges: $HAS_CHANGES"
          if [ "$STATUS" != "no_changes" ]; then
            echo "FAIL: expected status 'no_changes' but got '$STATUS'"
            exit 1
          fi
          if [ "$HAS_CHANGES" != "False" ]; then
            echo "FAIL: expected hasChanges=False but got '$HAS_CHANGES'"
            exit 1
          fi
          echo "PASS: drift-output has correct fields"
