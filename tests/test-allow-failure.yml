name: Test allow-failure input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Terraform
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl
          curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o /tmp/terraform.zip
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin/
          terraform version

      - id: action
        uses: .
        with:
          directory: tests/fixtures/allow-failure-tf
          comment: 'false'
          skip-plan: 'true'
          skip-conftest: 'true'
          skip-fmt: 'false'
          allow-failure: 'true'
          enable-drift-output: 'true'

      - name: Assert action completed (allow-failure=true means no step failure)
        run: |
          echo "PASS: action completed without failing the step (allow-failure=true)"

      - name: Assert drift-output status is failed when there are errors
        env:
          DRIFT_OUTPUT: ${{ steps.action.outputs.drift-output }}
        run: |
          echo "drift-output: $DRIFT_OUTPUT"
          if [ -z "$DRIFT_OUTPUT" ]; then
            echo "FAIL: drift-output should be set even on error"
            exit 1
          fi
          STATUS=$(echo "$DRIFT_OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])")
          echo "status: $STATUS"
          if [ "$STATUS" != "failed" ]; then
            echo "FAIL: expected status 'failed' but got '$STATUS'"
            exit 1
          fi
          echo "PASS: drift-output status is 'failed' as expected"
