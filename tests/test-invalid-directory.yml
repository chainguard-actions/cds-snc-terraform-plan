name: Test invalid directory handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action should fail when the directory does not exist.
      # We use continue-on-error so the workflow step does not abort,
      # then assert that the action reported failure via its outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: './nonexistent-directory-xyz'
          comment: 'false'
          skip-plan: 'true'
          skip-fmt: 'true'
          skip-conftest: 'true'

      - name: Assert action failed due to missing directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for missing directory, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for missing directory"
