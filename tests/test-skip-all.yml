name: Test skip-fmt skip-plan skip-conftest scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock terraform and tf-summarize
        run: |
          cat > /usr/local/bin/terraform << 'SCRIPT'
          #!/bin/sh
          echo "mock terraform $@"
          exit 0
          SCRIPT
          chmod +x /usr/local/bin/terraform
          cat > /usr/local/bin/tf-summarize << 'SCRIPT'
          #!/bin/sh
          echo "mock tf-summarize $@"
          exit 0
          SCRIPT
          chmod +x /usr/local/bin/tf-summarize

      - id: action
        uses: .
        with:
          directory: ${{ github.workspace }}/test/no-changes
          comment: 'false'
          skip-plan: 'true'
          skip-fmt: 'true'
          skip-conftest: 'true'
          github-token: 'false'

      - name: Assert drift-output is set
        env:
          DRIFT_OUTPUT: ${{ steps.action.outputs.drift-output }}
        run: |
          echo "drift-output: $DRIFT_OUTPUT"
          if [ -z "$DRIFT_OUTPUT" ]; then
            echo "FAIL: drift-output should not be empty"
            exit 1
          fi
          echo "PASS: drift-output is set"

      - name: Assert drift-output has expected fields
        env:
          DRIFT_OUTPUT: ${{ steps.action.outputs.drift-output }}
        run: |
          echo "drift-output: $DRIFT_OUTPUT"
          HAS_CHANGES=$(echo "$DRIFT_OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(str(d['hasChanges']).lower())")
          STATUS=$(echo "$DRIFT_OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])")
          echo "hasChanges: $HAS_CHANGES"
          echo "status: $STATUS"
          if [ "$HAS_CHANGES" != "false" ]; then
            echo "FAIL: expected hasChanges=false, got '$HAS_CHANGES'"
            exit 1
          fi
          if [ "$STATUS" != "no_changes" ]; then
            echo "FAIL: expected status='no_changes', got '$STATUS'"
            exit 1
          fi
          echo "PASS"
