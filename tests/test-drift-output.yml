name: Test drift-output JSON structure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal terraform config
        run: |
          mkdir -p /tmp/tf-drift
          cat > /tmp/tf-drift/main.tf <<'EOF'
          terraform {
            required_version = ">= 1.0"
          }

          output "hello" {
            value = "world"
          }
          EOF

      - id: action
        uses: .
        with:
          directory: /tmp/tf-drift
          skip-plan: "true"
          skip-conftest: "true"
          skip-fmt: "true"
          comment: "false"
          github-token: "false"
          allow-failure: "true"

      - name: Assert drift-output is valid JSON
        env:
          DRIFT_OUTPUT: ${{ steps.action.outputs.drift-output }}
        run: |
          echo "drift-output: $DRIFT_OUTPUT"
          if [ -z "$DRIFT_OUTPUT" ]; then
            echo "FAIL: drift-output is empty"
            exit 1
          fi
          # Validate it is parseable JSON
          echo "$DRIFT_OUTPUT" | python3 -m json.tool > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: drift-output is not valid JSON"
            exit 1
          fi
          echo "PASS: drift-output is valid JSON"
