name: Test missing directory fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake terraform
        run: bash tests/fixtures/setup-fake-terraform.sh "$GITHUB_WORKSPACE/tests/fixtures/plan-changes.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: does-not-exist-dir
          comment: 'false'
          skip-conftest: 'true'
      - name: Assert action failed without running terraform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing directory"
            exit 1
          fi
          if [ -s /tmp/fake-tf-calls.log ]; then
            cat /tmp/fake-tf-calls.log
            echo "FAIL: terraform should not have been invoked"
            exit 1
          fi
          echo "PASS"
